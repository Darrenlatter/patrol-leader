<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PL Training Assessment</title>
    <!-- HTML5 QR Code Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #7413dc; --bg: #f4f4f9; --text: #333; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; }
        header { background-color: var(--primary); color: white; padding: 1rem; text-align: center; }
        nav { display: flex; justify-content: space-around; background: #ddd; padding: 10px; }
        nav button { padding: 10px 20px; border: none; background: #ccc; cursor: pointer; border-radius: 5px; font-weight: bold; }
        nav button.active { background: var(--primary); color: white; }
        .container { padding: 20px; max-width: 600px; margin: auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        select, input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .criteria-row { background: white; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ddd; }
        .radio-group { display: flex; gap: 15px; margin-top: 5px; }
        .radio-group label { font-weight: normal; }
        button.submit-btn { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto 15px auto; border-radius: 8px; overflow: hidden; }
        .dashboard-card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ddd; }
        .scout-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
        .badge { background: #28a745; color: white; padding: 5px 10px; border-radius: 20px; font-size: 12px; }
    </style>
</head>
<body>

    <header>
        <h2>PL Training Assessment</h2>
    </header>

    <nav>
        <button id="nav-assess" class="active" onclick="switchTab('assess')">Assess</button>
        <button id="nav-dash" onclick="switchTab('dashboard')">Live Dashboard</button>
    </nav>

    <div class="container">
        <!-- ASSESS TAB -->
        <div id="assess" class="tab-content active">
            
            <div class="form-group">
                <label>Scan Scout QR Code (or select manually)</label>
                <div id="reader"></div>
                <select id="scoutSelect">
                    <option value="">-- Manual Fallback: Select Scout --</option>
                    <option value="P1-Joe">Joe Bloggs (Falcons)</option>
                    <option value="P2-Raf">Rafael (Eagles)</option>
                    <!-- Preload all scouts here -->
                </select>
                <p id="scoutConfirm" style="color: green; font-weight: bold; margin-top: 5px;"></p>
            </div>

            <div class="form-group">
                <label>Assessor Name</label>
                <input type="text" id="assessorName" placeholder="e.g. Akela">
            </div>

            <div class="form-group">
                <label>Activity / Base</label>
                <select id="activitySelect">
                    <option value="">-- Select Activity --</option>
                    <optgroup label="Instructing bases – Saturday am">
                        <option value="Film Star">Film Star</option>
                        <option value="Twisted fire starter">Twisted fire starter</option>
                        <option value="All tied up">All tied up</option>
                        <option value="All popped">All popped</option>
                        <option value="Sticky Marshmallow">Sticky Marshmallow</option>
                        <option value="Roasting time">Roasting time</option>
                    </optgroup>
                    <optgroup label="Teamwork and problem-solving bases – Saturday pm">
                        <option value="Trauma tower">Trauma tower</option>
                        <option value="Replication">Replication</option>
                        <option value="Nuclear cleanup">Nuclear cleanup</option>
                        <option value="Newspaper towers">Newspaper towers</option>
                        <option value="Remote control shear legs">Remote control shear legs</option>
                        <option value="Kim’s game">Kim’s game</option>
                    </optgroup>
                    <optgroup label="Inter patrol & Flagpole – Sunday">
                        <option value="Inter patrol challenge">Inter patrol challenge</option>
                        <option value="Flagpole teamwork challenge">Flagpole teamwork challenge</option>
                        <option value="Spare one">Spare one</option>
                        <option value="Spare two">Spare two</option>
                        <option value="Spare three">Spare three</option>
                    </optgroup>
                </select>
            </div>

            <div id="criteriaContainer"></div>

            <div class="form-group">
                <label>Other comments / evidence</label>
                <textarea id="comments" rows="3"></textarea>
            </div>

            <button class="submit-btn" onclick="submitAssessment()">Submit Assessment</button>
        </div>

        <!-- DASHBOARD TAB -->
        <div id="dashboard" class="tab-content">
            <div style="margin-bottom: 20px;">
                <button onclick="renderDashboard()" style="padding: 8px; width: 100%;">Refresh Live Data</button>
            </div>
            <div id="dashboardContainer"></div>
        </div>
    </div>

    <script>
        const criteria = [
            "PL took charge of the situation?",
            "Clear instructions to all patrol members?",
            "All patrol members clear about what they should be doing?",
            "Tasks delegated fairly?",
            "Checks progress of all patrol members & encourages them?",
            "Sorts out any problems the patrol may have?",
            "Everyone is taking an active part?",
            "Views of other patrol members taken into account?",
            "Risks assessed and communicated"
        ];

        let assessments = JSON.parse(localStorage.getItem('pl_assessments')) || [];
        let html5QrcodeScanner;

        // Initialize criteria form
        const criteriaContainer = document.getElementById('criteriaContainer');
        criteria.forEach((crit, index) => {
            criteriaContainer.innerHTML += `
                <div class="criteria-row">
                    <label>${crit}</label>
                    <div class="radio-group">
                        <label><input type="radio" name="crit_${index}" value="Y"> Yes</label>
                        <label><input type="radio" name="crit_${index}" value="N"> No</label>
                        <label><input type="radio" name="crit_${index}" value="NOB" checked> Not observed</label>
                    </div>
                </div>
            `;
        });

        // Tab Switching logic
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            
            if(tabId === 'assess') {
                document.getElementById('nav-assess').classList.add('active');
                initScanner();
            } else {
                document.getElementById('nav-dash').classList.add('active');
                if(html5QrcodeScanner) {
                    html5QrcodeScanner.clear().catch(error => console.error("Failed to clear scanner", error));
                }
                renderDashboard();
            }
        }

        // QR Scanner init
        function initScanner() {
            if(html5QrcodeScanner) return;
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
            html5QrcodeScanner.render((decodedText) => {
                document.getElementById('scoutSelect').value = decodedText; // Assumes QR text matches the <option> value
                document.getElementById('scoutConfirm').innerText = `✓ Scout Identified: ${decodedText}`;
                html5QrcodeScanner.pause();
                setTimeout(() => html5QrcodeScanner.resume(), 3000); // pause so they don't scan twice by accident
            }, (error) => {});
        }

        window.onload = () => { initScanner(); };

       // Paste your Google Web App URL here
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbziOAd3VLWhzGuzm9pWi5kz9AMgJhBXU0v5HjPOVdOYTHxniWF16W0QKC5ZzpBeQ5BLLg/exec"; 

async function submitAssessment() {
    const scout = document.getElementById('scoutSelect').value;
    const activity = document.getElementById('activitySelect').value;
    const assessor = document.getElementById('assessorName').value;
    const comments = document.getElementById('comments').value;

    if(!scout || !activity || !assessor) {
        alert("Please fill in Scout, Assessor, and Activity.");
        return;
    }

    let results = [];
    let yCount = 0;
    criteria.forEach((crit, index) => {
        const val = document.querySelector(`input[name="crit_${index}"]:checked`).value;
        results.push({ criterion: crit, score: val });
        if(val === 'Y') yCount++;
    });

    const record = { scout, activity, assessor, results, yCount, comments };
    const submitBtn = document.querySelector('.submit-btn');
    submitBtn.innerText = "Submitting...";
    submitBtn.disabled = true;

    try {
        await fetch(WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify(record)
        });
        
        alert("Assessment saved to live dashboard!");
        document.getElementById('scoutConfirm').innerText = "";
        document.getElementById('scoutSelect').value = "";
        document.getElementById('comments').value = "";
        criteria.forEach((crit, index) => {
            document.querySelector(`input[name="crit_${index}"][value="NOB"]`).checked = true;
        });
    } catch (error) {
        alert("Error saving. Please check your internet connection.");
        console.error(error);
    } finally {
        submitBtn.innerText = "Submit Assessment";
        submitBtn.disabled = false;
    }
}

async function renderDashboard() {
    const dash = document.getElementById('dashboardContainer');
    dash.innerHTML = "<p>Loading live data from server...</p>";

    try {
        const response = await fetch(WEB_APP_URL);
        const assessments = await response.json();

        if(assessments.length === 0) {
            dash.innerHTML = "<p>No assessments recorded yet.</p>";
            return;
        }

        dash.innerHTML = "";
        const grouped = {};
        assessments.forEach(a => {
            if(!grouped[a.scout]) grouped[a.scout] = [];
            grouped[a.scout].push(a);
        });

        for (const [scoutName, records] of Object.entries(grouped)) {
            let demonstratedCriteria = new Set();
            records.forEach(rec => {
                rec.results.forEach(res => {
                    if(res.score === 'Y') demonstratedCriteria.add(res.criterion);
                });
            });

            let totalScore = demonstratedCriteria.size;
            let pct = Math.round((totalScore / 9) * 100);
            
            let criteriaHtml = "<ul style='padding-left: 20px;'>";
            criteria.forEach(crit => {
                if(demonstratedCriteria.has(crit)) {
                    criteriaHtml += `<li style="color: green; margin-bottom: 5px;">✓ ${crit}</li>`;
                } else {
                    criteriaHtml += `<li style="color: gray; margin-bottom: 5px;">○ ${crit}</li>`;
                }
            });
            criteriaHtml += "</ul>";

            dash.innerHTML += `
                <div class="dashboard-card">
                    <div class="scout-header">
                        <h3 style="margin: 0;">${scoutName}</h3>
                        <span class="badge">${totalScore}/9 Attributes (${pct}%)</span>
                    </div>
                    <p style="font-size: 13px; color: #666; margin-top: 0;">Assessed at: ${records.map(r => r.activity).join(', ')}</p>
                    ${criteriaHtml}
                </div>
            `;
        }
    } catch (error) {
        dash.innerHTML = "<p style='color: red;'>Failed to load data. Please check your connection.</p>";
        console.error(error);
    }
}
        }
    </script>
</body>
</html>
